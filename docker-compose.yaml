
services:
  user-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_DATABASE}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/user-schema:/docker-entrypoint-initdb.d 
    networks:
      - internal  

networks:
  internal:
    driver: bridge
    internal: true  
  public: 
    driver: bridge

volumes:
  postgres_data:  
  rabbitmq_data:
  backup_data: